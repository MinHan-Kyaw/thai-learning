version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Asia/Bangkok'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    ignore:
      # eslint-plugin-react and eslint-plugin-jsx-a11y do not support ESLint 10 yet; move eslint and @eslint/js together.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Types must match the Node.js runtime in .nvmrc (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript < 6.1; raise this once it supports newer versions.
      - dependency-name: 'typescript'
        versions: ['>= 6.1.0']
    groups:
      # vitest and its plugins share a peer range, so they must be upgraded in one pull request.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      development-dependencies:
        applies-to: 'version-updates'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-minor-patch:
        applies-to: 'version-updates'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Asia/Bangkok'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 60
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
